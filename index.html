<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Basketball - Memory Challenge</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; touch-action: none; }
        #videoContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; background: #000; display: flex; justify-content: center; align-items: center; }
        #introVideo { width: 100%; height: 100%; object-fit: cover; }
        #introUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; text-align: center; }
        #playerName { padding: 15px; font-size: 20px; border: 3px solid #ff4400; border-radius: 12px; background: #111; color: #fff; text-align: center; width: 280px; margin-bottom: 20px; outline: none; }
        #playerPreview { width: 150px; height: 150px; border: 4px solid #ff4400; border-radius: 50%; margin-bottom: 20px; display: none; object-fit: cover; box-shadow: 0 0 20px #ff4400; }
        .btn { padding: 15px 50px; font-size: 22px; background: #ff4400; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 68, 0, 0.5); transition: 0.3s; }
        #playBtn { display: none; background: #28a745; }
        #playerTablo { position: fixed; top: 25px; left: 25px; display: none; align-items: center; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); padding: 10px 20px; border-radius: 20px; border-left: 6px solid #ff4400; z-index: 100; }
        #tabloImg { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; margin-right: 15px; }
        #tabloName { color: #fff; font-size: 18px; text-transform: uppercase; }
        #scoreboard { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); padding: 10px 40px; border-radius: 15px; border-bottom: 4px solid #ff4400; display: none; gap: 30px; align-items: center; z-index: 100; }
        .value { color: #fff; font-size: 45px; line-height: 1; }
        #resultScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 600; text-align: center; padding: 20px; }
        #questionBox { margin-top: 25px; padding: 25px; background: #1a1a1a; border: 2px dashed #ff4400; border-radius: 20px; max-width: 500px; display: none; }
        #individualQuestion { font-size: 22px; color: #fff; font-style: italic; line-height: 1.4; }
        #retryBtn { margin-top: 30px; display: none; }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="introVideo" autoplay muted playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div id="introUI">
            <h1 style="color:#ff4400; font-size: 40px;">PLAYER SELECT</h1>
            <input type="text" id="playerName" placeholder="Ismingizni kiriting...">
            <img id="playerPreview" src="">
            <button id="checkBtn" class="btn" onclick="checkPlayer()">TEKSHIRISH</button>
            <button id="playBtn" class="btn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <div id="playerTablo">
        <img id="tabloImg" src="">
        <div id="tabloName">PLAYER</div>
    </div>

    <div id="scoreboard">
        <div style="text-align:center"><div style="color:#ff4400; font-size:11px;">POINTS</div><div id="scoreVal" class="value">0</div></div>
        <div style="width: 2px; height: 40px; background: rgba(255,255,255,0.2);"></div>
        <div style="text-align:center"><div style="color:#ff4400; font-size:11px;">SHOTS</div><div id="livesVal" class="value">5</div></div>
    </div>

    <div id="resultScreen">
        <h1 id="resultTitle" style="font-size: 55px;"></h1>
        <p id="resultText" style="font-size: 24px;"></p>
        <div id="questionBox">
            <h3 style="color:#ff4400; margin-top:0; font-size: 14px; letter-spacing: 2px;">DIQQAT: SAVOL!</h3>
            <p id="individualQuestion"></p>
        </div>
        <button id="retryBtn" class="btn" onclick="restartGame()">QAYTADAN BOSHLASH</button>
    </div>
    
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("introVideo");
        const introUI = document.getElementById("introUI");
        const playerNameInput = document.getElementById("playerName");
        const playerPreview = document.getElementById("playerPreview");
        
        const questionsMap = {
            "Sardor": "Xotira nima va uning tarkibiy jarayonlari qaysilar?",
            "Sultonbek": "Mnemik jarayon tushunchasiga nimalar kiradi?",
            "Diyorbek": "Esda olib qolishning nerv-fiziologik asosi nima?",
            "Mehroj": "Esda olib qolish jarayonida qanday bog'lanishlar yuzaga keladi?",
            "E'zoza": "\"Qulay sharoit\" deganda nimani tushunasiz?",
            "Nilufar": "Nima uchun barcha saqlangan ma'lumotlar esga tushavermaydi?",
            "Navbahor": "Xotira sifati qanday ko'rsatkichlar bilan baholanadi?",
            "Gulzoda": "Xotira mustahkamligi qanday aniqlanadi?",
            "Mohlaroyim": "4ta xotira tiplarini sanab bering.",
            "Sevinch": "Eng samarali xotira tipi qaysi va nima uchun?",
            "Sohiba": "Ixtiyoriy esda olib qolish nima?",
            "Ruxshona": "Ixtiyorsiz esda olib qolish qachon yuz beradi?",
            "Shahzoda": "Nutq xotirada qanday rol o'ynaydi?"
        };

        const bg = new Image(); bg.src = "bg.jpg"; 
        const ballImg = new Image(); ballImg.src = "ball.png";
        const hoopImg = new Image(); hoopImg.src = "hoop_side.png";

        let score = 0, lives = 5, isGameOver = false, gameStarted = false, activeName = "";
        const gravity = 0.45;

        video.onerror = function() { introUI.style.display = "flex"; };
        video.onended = function() { introUI.style.display = "flex"; };
        video.addEventListener('timeupdate', function() {
            if (this.currentTime >= 5) { this.pause(); introUI.style.display = "flex"; }
        });

        function checkPlayer() {
            const name = playerNameInput.value.trim();
            const foundKey = Object.keys(questionsMap).find(k => k.toLowerCase() === name.toLowerCase());
            if (foundKey) {
                activeName = foundKey;
                playerPreview.src = foundKey + ".jpg";
                playerPreview.onload = () => {
                    playerPreview.style.display = "block";
                    document.getElementById("checkBtn").style.display = "none";
                    document.getElementById("playBtn").style.display = "block";
                    document.getElementById("tabloImg").src = foundKey + ".jpg";
                    document.getElementById("tabloName").innerText = foundKey;
                };
            } else { alert("Bu ism ro'yxatda yo'q!"); }
        }

        function startGame() {
            document.getElementById("videoContainer").style.display = "none";
            document.getElementById("scoreboard").style.display = "flex";
            document.getElementById("playerTablo").style.display = "flex";
            gameStarted = true;
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        let hoop = { x: window.innerWidth - 350, y: window.innerHeight * 0.18, width: 260, height: 200, rimY: 61, rimLeft: 38, rimRight: 215 };
        let ball = { startX: 250, startY: (window.innerHeight * 0.75) - 38, x: 250, y: (window.innerHeight * 0.75) - 38, vx: 0, vy: 0, size: 83, rotation: 0, spinSpeed: 0, shooting: false, dragged: false, scored: false };

        function update() {
            if (!gameStarted || isGameOver) return;
            if (ball.shooting) {
                ball.x += ball.vx; ball.y += ball.vy; ball.vy += gravity; ball.rotation += ball.spinSpeed;
                let absRimY = hoop.y + hoop.rimY, absRimL = hoop.x + hoop.rimLeft, absRimR = hoop.x + hoop.rimRight;
                [absRimL, absRimR].forEach(rx => {
                    let dist = Math.hypot(ball.x - rx, ball.y - absRimY);
                    if (dist < ball.size / 2) {
                        let angle = Math.atan2(ball.y - absRimY, ball.x - rx);
                        let speed = Math.sqrt(ball.vx**2 + ball.vy**2) * 0.75;
                        ball.vx = Math.cos(angle) * speed; ball.vy = Math.sin(angle) * speed;
                    }
                });
                if (!ball.scored && ball.vy > 0 && ball.x > absRimL && ball.x < absRimR && Math.abs(ball.y - absRimY) < 20) {
                    score += 3; document.getElementById("scoreVal").innerText = score; ball.scored = true;
                }
                if (ball.y > canvas.height + 100 || ball.x > canvas.width + 150 || ball.x < -150) {
                    if (lives <= 0) showResult(); else resetBall();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(hoopImg, hoop.x, hoop.y, hoop.width, hoop.height);
            if (!gameStarted) return;
            if (ball.dragged) {
                let tVX = (ball.startX - dragX) * 0.12, tVY = (ball.startY - dragY) * 0.12, tx = ball.startX, ty = ball.startY, tvy = tVY;
                for (let i = 0; i < 43; i++) {
                    if (i % 2 === 0) {
                        let miniSize = 25 - (i * 0.4);
                        ctx.save(); ctx.globalAlpha = Math.max(0, 0.9 - (i/43));
                        ctx.drawImage(ballImg, tx - miniSize/2, ty - miniSize/2, miniSize, miniSize);
                        ctx.restore();
                    }
                    tx += tVX * 1.7; ty += tvy * 1.7; tvy += gravity * 1.7;
                }
            }
            ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rotation);
            ctx.drawImage(ballImg, -ball.size/2, -ball.size/2, ball.size, ball.size);
            ctx.restore();
        }

        function showResult() {
            isGameOver = true;
            const goals = Math.floor(score / 3);
            const resultScreen = document.getElementById("resultScreen");
            const qBox = document.getElementById("questionBox");
            const retryBtn = document.getElementById("retryBtn");
            
            resultScreen.style.display = "flex";
            document.getElementById("resultText").innerText = `${activeName}, natijangiz: ${goals} / 5`;

            if (goals >= 3) {
                document.getElementById("resultTitle").innerText = "🏆 WINNER!";
                document.getElementById("resultTitle").style.color = "#00ff00";
                qBox.style.display = "none";
                retryBtn.style.display = "block";
            } else {
                document.getElementById("resultTitle").innerText = "🏀 GAME OVER";
                document.getElementById("resultTitle").style.color = "#ff0000";
                qBox.style.display = "block";
                document.getElementById("individualQuestion").innerText = questionsMap[activeName];
                retryBtn.style.display = "none";
            }
        }

        function resetBall() { ball.x = ball.startX; ball.y = ball.startY; ball.vx = 0; ball.vy = 0; ball.rotation = 0; ball.spinSpeed = 0; ball.shooting = false; ball.dragged = false; ball.scored = false; }
        function restartGame() { score = 0; lives = 5; isGameOver = false; document.getElementById("scoreVal").innerText = "0"; document.getElementById("livesVal").innerText = "5"; document.getElementById("resultScreen").style.display = "none"; resetBall(); }

        let dragX, dragY;
        function hS(e) { if (!gameStarted || isGameOver || lives <= 0) return; let p = e.touches ? e.touches[0] : e; if (Math.hypot(p.clientX - ball.x, p.clientY - ball.y) < 100) { ball.dragged = true; dragX = p.clientX; dragY = p.clientY; } }
        function hM(e) { if (ball.dragged) { let p = e.touches ? e.touches[0] : e; dragX = p.clientX; dragY = p.clientY; } }
        function hE() { if (ball.dragged) { lives--; document.getElementById("livesVal").innerText = lives; ball.vx = (ball.startX - dragX) * 0.12; ball.vy = (ball.startY - dragY) * 0.12; ball.spinSpeed = ball.vx * 0.1; ball.shooting = true; ball.dragged = false; } }

        canvas.addEventListener("mousedown", hS); window.addEventListener("mousemove", hM); window.addEventListener("mouseup", hE);
        canvas.addEventListener("touchstart", hS); window.addEventListener("touchmove", hM); window.addEventListener("touchend", hE);

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        bg.onload = loop;
    </script>
</body>
</html>
