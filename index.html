<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Basketball - Memory Challenge</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
        #videoContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; background: #000; display: flex; justify-content: center; align-items: center; }
        #introVideo { width: 100%; height: 100%; object-fit: cover; }
        #introUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; text-align: center; }
        #playerName { padding: 15px; font-size: 20px; border: 3px solid #ff4400; border-radius: 12px; background: #111; color: #fff; text-align: center; width: 80%; max-width: 280px; margin-bottom: 20px; outline: none; }
        
        /* Profil rasmini kattalashtirish */
        #playerPreview { width: 180px; height: 180px; border: 5px solid #ff4400; border-radius: 50%; margin-bottom: 20px; display: none; object-fit: cover; box-shadow: 0 0 30px #ff4400; }
        
        .btn { padding: 15px 40px; font-size: 20px; background: #ff4400; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 68, 0, 0.5); }
        #playBtn { display: none; background: #28a745; }
        
        /* Tablo rasmini kattalashtirish */
        #playerTablo { position: fixed; top: 15px; left: 15px; display: none; align-items: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 20px; border-left: 6px solid #ff4400; z-index: 100; }
        #tabloImg { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; margin-right: 15px; }
        
        #scoreboard { position: fixed; top: 15px; left: 55%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); padding: 8px 35px; border-radius: 15px; border-bottom: 4px solid #ff4400; display: none; gap: 25px; align-items: center; z-index: 100; }
        .value { color: #fff; font-size: 40px; line-height: 1; }
        #resultScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 600; text-align: center; padding: 20px; }
        #questionBox { margin-top: 20px; padding: 20px; background: #1a1a1a; border: 2px dashed #ff4400; border-radius: 15px; width: 90%; max-width: 450px; display: none; }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="introVideo" autoplay muted playsinline><source src="background.mp4" type="video/mp4"></video>
        <div id="introUI">
            <h2 style="color:#ff4400; font-size: 35px;">PLAYER SELECT</h2>
            <input type="text" id="playerName" placeholder="Ismingizni kiriting...">
            <img id="playerPreview" src="">
            <button id="checkBtn" class="btn" onclick="checkPlayer()">TEKSHIRISH</button>
            <button id="playBtn" class="btn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <div id="playerTablo">
        <img id="tabloImg" src="">
        <div id="tabloName" style="color:white; font-size:18px; text-transform: uppercase;">PLAYER</div>
    </div>

    <div id="scoreboard">
        <div style="text-align:center"><div style="color:#ff4400; font-size:12px;">POINTS</div><div id="scoreVal" class="value">0</div></div>
        <div style="text-align:center"><div style="color:#ff4400; font-size:12px;">SHOTS</div><div id="livesVal" class="value">5</div></div>
    </div>

    <div id="resultScreen">
        <h1 id="resultTitle" style="font-size: 50px; margin:0;"></h1>
        <p id="resultText" style="font-size: 24px;"></p>
        <div id="questionBox">
            <h3 style="color:#ff4400; margin:0;">DIQQAT: SAVOL!</h3>
            <p id="individualQuestion" style="font-style: italic; font-size: 20px;"></p>
        </div>
        <button id="retryBtn" class="btn" style="margin-top:20px;" onclick="location.reload()">QAYTADAN BOSHLASH</button>
    </div>
    
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const video = document.getElementById("introVideo");
        const introUI = document.getElementById("introUI");
        
        const questionsMap = {
            "Sardor": "Xotira nima va uning tarkibiy jarayonlari qaysilar?",
            "Sultonbek": "Mnemik jarayon tushunchasiga nimalar kiradi?",
            "Diyorbek": "Esda olib qolishning nerv-fiziologik asosi nima?",
            "Mehroj": "Esda olib qolish jarayonida qanday bog'lanishlar yuzaga keladi?",
            "E'zoza": "Qulay sharoit deganda nimani tushunasiz?",
            "Nilufar": "Nima uchun barcha ma'lumotlar esga tushavermaydi?",
            "Navbahor": "Xotira sifati qanday ko'rsatkichlar bilan baholanadi?",
            "Gulzoda": "Xotira mustahkamligi qanday aniqlanadi?",
            "Mohlaroyim": "4ta xotira tiplarini sanab bering.",
            "Sevinch": "Eng samarali xotira tipi qaysi va nima uchun?",
            "Sohiba": "Ixtiyoriy esda olib qolish nima?",
            "Ruxshona": "Ixtiyorsiz esda olib qolish qachon yuz beradi?",
            "Shahzoda": "Nutq xotirada qanday rol o'ynaydi?"
        };

        const bg = new Image(); bg.src = "bg.jpg"; 
        const ballImg = new Image(); ballImg.src = "ball.png";
        const hoopImg = new Image(); hoopImg.src = "hoop_side.png";

        let score = 0, lives = 5, isGameOver = false, gameStarted = false, activeName = "";
        const gravity = 0.45;
        
        // Savat harakati uchun o'zgaruvchilar
        let hoopDirection = 1;
        let hoopSpeed = 2.5;

        let hoop = { x: 0, y: 0, w: 0, h: 0, rimY: 0, rimL: 0, rimR: 0, baseY: 0 };
        let ball = { x: 0, y: 0, sx: 0, sy: 0, vx: 0, vy: 0, size: 0, rotation: 0, shooting: false, dragged: false, scored: false };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            hoop.w = Math.min(canvas.width * 0.35, 260);
            hoop.h = hoop.w * 0.77;
            hoop.x = canvas.width - hoop.w - (canvas.width * 0.05);
            hoop.baseY = canvas.height * 0.18;
            hoop.y = hoop.baseY;
            hoop.rimY = hoop.h * 0.3;
            hoop.rimL = hoop.w * 0.15;
            hoop.rimR = hoop.w * 0.85;
            ball.size = hoop.w * 0.32;
            ball.sx = canvas.width * 0.15;
            ball.sy = canvas.height * 0.75;
            if(!ball.shooting) { ball.x = ball.sx; ball.y = ball.sy; }
        }
        window.onresize = resize; resize();

        video.onended = () => { introUI.style.display = "flex"; };
        video.addEventListener('timeupdate', function() { if (this.currentTime >= 5) { this.pause(); introUI.style.display = "flex"; } });

        function checkPlayer() {
            const name = document.getElementById("playerName").value.trim();
            const foundKey = Object.keys(questionsMap).find(k => k.toLowerCase() === name.toLowerCase());
            if (foundKey) {
                activeName = foundKey;
                document.getElementById("playerPreview").src = foundKey + ".jpg";
                document.getElementById("playerPreview").style.display = "block";
                document.getElementById("checkBtn").style.display = "none";
                document.getElementById("playBtn").style.display = "block";
                document.getElementById("tabloImg").src = foundKey + ".jpg";
                document.getElementById("tabloName").innerText = foundKey;
            } else { alert("Ism topilmadi!"); }
        }

        function startGame() {
            document.getElementById("videoContainer").style.display = "none";
            document.getElementById("scoreboard").style.display = "flex";
            document.getElementById("playerTablo").style.display = "flex";
            gameStarted = true;
            loop();
        }

        function update() {
            if (!gameStarted || isGameOver) return;

            // Savat harakati: 2-urinishdan keyin (lives < 4 bo'lganda)
            if (lives < 4) {
                hoop.y += hoopSpeed * hoopDirection;
                if (hoop.y > hoop.baseY + 100 || hoop.y < hoop.baseY - 50) {
                    hoopDirection *= -1;
                }
            }

            if (ball.shooting) {
                ball.x += ball.vx; ball.y += ball.vy; ball.vy += gravity; ball.rotation += ball.vx * 0.05;
                let rY = hoop.y + hoop.rimY, rL = hoop.x + hoop.rimL, rR = hoop.x + hoop.rimR;
                
                [rL, rR].forEach(rx => {
                    let d = Math.hypot(ball.x - rx, ball.y - rY);
                    if (d < ball.size/2) {
                        let a = Math.atan2(ball.y - rY, ball.x - rx);
                        ball.vx = Math.cos(a) * 5; ball.vy = Math.sin(a) * 5;
                    }
                });

                if (!ball.scored && ball.vy > 0 && ball.x > rL && ball.x < rR && Math.abs(ball.y - rY) < 20) {
                    score += 3; document.getElementById("scoreVal").innerText = score; ball.scored = true;
                }

                if (ball.y > canvas.height + 50 || ball.x > canvas.width + 100 || ball.x < -100) {
                    if (lives <= 1) {
                        lives = 0;
                        document.getElementById("livesVal").innerText = 0;
                        showResult();
                    } else {
                        lives--;
                        document.getElementById("livesVal").innerText = lives;
                        resetBall();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
            ctx.drawImage(hoopImg, hoop.x, hoop.y, hoop.w, hoop.h);
            
            if (ball.dragged) {
                let tVX = (ball.sx - dragX) * 0.12, tVY = (ball.sy - dragY) * 0.12, tx = ball.sx, ty = ball.sy, tvy = tVY;
                for (let i = 0; i < 35; i++) {
                    if (i % 3 === 0) {
                        let ms = ball.size * 0.3 * (1 - i/35);
                        ctx.save(); ctx.globalAlpha = 0.6 - (i/35);
                        ctx.drawImage(ballImg, tx - ms/2, ty - ms/2, ms, ms);
                        ctx.restore();
                    }
                    tx += tVX * 1.8; ty += tvy * 1.8; tvy += gravity * 1.8;
                }
            }
            ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rotation);
            ctx.drawImage(ballImg, -ball.size/2, -ball.size/2, ball.size, ball.size);
            ctx.restore();
        }

        function showResult() {
            isGameOver = true;
            document.getElementById("resultScreen").style.display = "flex";
            const goals = score / 3; // Har bir gol 3 ochko
            document.getElementById("resultText").innerText = `${activeName}, natijangiz: ${goals} / 5`;
            
            // Winner sharti: 5 tadan 4 ta tushsa (4 * 3 = 12 ochko)
            if (goals >= 4) {
                document.getElementById("resultTitle").innerText = "🏆 WINNER!";
                document.getElementById("resultTitle").style.color = "#00ff00";
                document.getElementById("questionBox").style.display = "none";
            } else {
                document.getElementById("resultTitle").innerText = "🏀 GAME OVER";
                document.getElementById("resultTitle").style.color = "#ff0000";
                document.getElementById("questionBox").style.display = "block";
                document.getElementById("individualQuestion").innerText = questionsMap[activeName];
                document.getElementById("retryBtn").style.display = "none";
            }
        }

        function resetBall() { ball.x = ball.sx; ball.y = ball.sy; ball.vx = 0; ball.vy = 0; ball.shooting = false; ball.dragged = false; ball.scored = false; }
        
        let dragX, dragY;
        function hS(e) { if (!gameStarted || isGameOver || ball.shooting) return; let p = e.touches ? e.touches[0] : e; if (Math.hypot(p.clientX - ball.x, p.clientY - ball.y) < 100) { ball.dragged = true; dragX = p.clientX; dragY = p.clientY; } }
        function hM(e) { if (ball.dragged) { let p = e.touches ? e.touches[0] : e; dragX = p.clientX; dragY = p.clientY; } }
        function hE() { if (ball.dragged) { ball.vx = (ball.sx - dragX) * 0.12; ball.vy = (ball.sy - dragY) * 0.12; ball.shooting = true; ball.dragged = false; } }

        canvas.addEventListener("mousedown", hS); window.addEventListener("mousemove", hM); window.addEventListener("mouseup", hE);
        canvas.addEventListener("touchstart", hS); window.addEventListener("touchmove", hM); window.addEventListener("touchend", hE);

        function loop() { update(); draw(); if(!isGameOver) requestAnimationFrame(loop); }
        bg.onload = () => { if(!gameStarted) draw(); };
    </script>
</body>
</html>
