<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Basketball Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
        #videoContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; background: #000; display: flex; justify-content: center; align-items: center; }
        #introVideo { width: 100%; height: 100%; object-fit: cover; }
        #introUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: white; }
        .btn { padding: 15px 40px; font-size: 20px; background: #ff4400; color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; }
        #playerName { padding: 12px; border-radius: 10px; border: 2px solid #ff4400; margin-bottom: 10px; width: 250px; text-align: center; }
        #scoreboard { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; background: rgba(0,0,0,0.7); padding: 10px 30px; border-radius: 15px; z-index: 100; color: white; gap: 20px; }
        #resultScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 600; text-align: center; }
    </style>
</head>
<body>

<div id="videoContainer">
    <video id="introVideo" autoplay muted playsinline><source src="background.mp4" type="video/mp4"></video>
    <div id="introUI">
        <input type="text" id="playerName" placeholder="Ismingizni kiriting...">
        <button id="checkBtn" class="btn" onclick="checkPlayer()">TEKSHIRISH</button>
        <button id="playBtn" class="btn" style="display:none;" onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="scoreboard">
    <div>POINTS: <span id="scoreVal">0</span></div>
    <div>SHOTS: <span id="livesVal">5</span></div>
</div>

<div id="resultScreen">
    <h1 id="resultTitle"></h1>
    <p id="resultText"></p>
    <div id="questionBox" style="margin: 20px; padding: 15px; border: 1px dashed #ff4400;">
        <p id="individualQuestion"></p>
    </div>
    <button id="retryBtn" class="btn" onclick="location.reload()">QAYTADAN</button>
</div>

<canvas id="game"></canvas>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const questionsMap = { "Sardor": "Xotira nima?", "Sohiba": "Ixtiyoriy esda olib qolish nima?", "Sultonbek": "Mnemik jarayon nima?" }; // Qolganlarni qo'shing

    const bg = new Image(); bg.src = "bg.jpg";
    const ballImg = new Image(); ballImg.src = "ball.png";
    const hoopImg = new Image(); hoopImg.src = "hoop_side.png";

    let score = 0, lives = 5, gameStarted = false, isGameOver = false, activeName = "";
    let hoop = { x: 0, y: 0, w: 0, h: 0 };
    let ball = { x: 0, y: 0, sx: 0, sy: 0, r: 35, vx: 0, vy: 0, shooting: false, dragged: false };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Savatni ekran kengligining 70% qismiga joylash (Mobil uchun mos)
        hoop.w = canvas.width * 0.25;
        hoop.h = hoop.w * 0.75;
        hoop.x = canvas.width * 0.65; 
        hoop.y = canvas.height * 0.15;

        // Koptokni ekran kengligining 20% qismiga joylash
        ball.sx = canvas.width * 0.2;
        ball.sy = canvas.height * 0.7;
        if (!ball.shooting) { ball.x = ball.sx; ball.y = ball.sy; }
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById("introVideo").onended = () => document.getElementById("introUI").style.display = "flex";
    setTimeout(() => { if(!gameStarted) document.getElementById("introUI").style.display = "flex"; }, 5000);

    function checkPlayer() {
        activeName = document.getElementById("playerName").value.trim();
        if (questionsMap[activeName]) {
            document.getElementById("checkBtn").style.display = "none";
            document.getElementById("playBtn").style.display = "block";
        } else { alert("Ism xato!"); }
    }

    function startGame() {
        document.getElementById("videoContainer").style.display = "none";
        document.getElementById("scoreboard").style.display = "flex";
        gameStarted = true;
        loop();
    }

    function showResult() {
        isGameOver = true;
        document.getElementById("resultScreen").style.display = "flex";
        document.getElementById("resultText").innerText = `${activeName}, ball: ${score}`;
        if (score < 9) {
            document.getElementById("resultTitle").innerText = "GAME OVER";
            document.getElementById("individualQuestion").innerText = questionsMap[activeName];
            document.getElementById("retryBtn").style.display = "none";
        } else {
            document.getElementById("resultTitle").innerText = "WINNER!";
            document.getElementById("retryBtn").style.display = "block";
        }
    }

    function loop() {
        if (isGameOver) return;
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.drawImage(bg, 0,0, canvas.width, canvas.height);
        ctx.drawImage(hoopImg, hoop.x, hoop.y, hoop.w, hoop.h);

        if (ball.shooting) {
            ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.4;
            // Savatga tushish mantiqi
            if (ball.vy > 0 && ball.y > hoop.y + 20 && ball.x > hoop.x + 20 && ball.x < hoop.x + hoop.w - 20) {
                score += 3; document.getElementById("scoreVal").innerText = score;
                ball.shooting = false; ball.x = ball.sx; ball.y = ball.sy;
            }
            if (ball.y > canvas.height || ball.x > canvas.width) {
                if (lives <= 1) showResult(); else { lives--; document.getElementById("livesVal").innerText = lives; ball.shooting = false; ball.x = ball.sx; ball.y = ball.sy; }
            }
        }
        ctx.drawImage(ballImg, ball.x - ball.r, ball.y - ball.r, ball.r*2, ball.r*2);
        requestAnimationFrame(loop);
    }

    // Touch boshqaruvi
    let startX, startY;
    canvas.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        if (Math.hypot(startX - ball.x, startY - ball.y) < 50) ball.dragged = true;
    });
    canvas.addEventListener("touchend", (e) => {
        if (ball.dragged) {
            let endX = e.changedTouches[0].clientX; let endY = e.changedTouches[0].clientY;
            ball.vx = (startX - endX) * 0.12; ball.vy = (startY - endY) * 0.12;
            ball.shooting = true; ball.dragged = false;
        }
    });
</script>
</body>
</html>
